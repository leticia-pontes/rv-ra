<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sonda de capacidades WebXR</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      html, body { min-height: 100%; background: #080b12; color: #f5f7ff; }
      #app { position: fixed; inset: 0; }
      #app canvas { opacity: 0.32; }
      #capability-report {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(520px, 100%);
        overflow-y: auto;
        padding: 28px;
        background: rgba(8, 11, 18, 0.94);
        backdrop-filter: blur(18px);
        border-right: 1px solid #273047;
      }
      .report-header { margin-bottom: 24px; }
      .eyebrow { color: #8ba4ff; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
      h1 { margin-top: 6px; font-size: clamp(26px, 7vw, 38px); line-height: 1.05; }
      h2 { font-size: 15px; margin-bottom: 12px; }
      h3 { font-size: 13px; margin-bottom: 6px; }
      .subtitle { margin-top: 12px; color: #9099ad; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
      .report-card { margin-bottom: 12px; padding: 16px; border: 1px solid #273047; border-radius: 14px; background: #111725; }
      .report-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid #20283a; }
      .report-row:first-of-type { border-top: 0; }
      .report-row strong { display: block; font-size: 13px; }
      .report-row small { display: block; max-width: 310px; margin-top: 4px; color: #aab2c3; line-height: 1.4; }
      .status { flex: 0 0 auto; padding: 4px 8px; border-radius: 999px; background: #30394d; color: #dbe2f2; font-size: 10px; font-weight: 800; text-transform: uppercase; }
      .status-suportado, .status-concedido, .status-ativo { background: #153f34; color: #76efc0; }
      .status-nao-suportado, .status-negado, .status-erro { background: #4c2027; color: #ff9ba8; }
      .status-verificando, .status-indeterminado, .status-nao-concedido { background: #493a1c; color: #ffd378; }
      .hint, .input-source p, .timestamp { color: #aab2c3; font-size: 12px; line-height: 1.5; }
      .probe-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
      button { min-height: 44px; border: 0; border-radius: 10px; background: #5878ff; color: white; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .38; cursor: not-allowed; }
      .error-message { margin-top: 12px; color: #ff9ba8; font-size: 12px; overflow-wrap: anywhere; }
      .input-source { margin-top: 10px; padding: 12px; border-radius: 10px; background: #0b101c; }
      .timestamp { padding: 6px 2px 28px; }
      @media (max-width: 600px) {
        #capability-report { padding: 20px 16px; border-right: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <main id="capability-report" aria-live="polite"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
